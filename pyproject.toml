[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mazini"
version = "0.1.0"
description = "Arabic verb conjugator — every form of any verb from its root and pattern; a pure-Python port of Wiktionary's Module:ar-verb, verified against 15,549 printed forms"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Wael Tellat", email = "wael.tellat@gmail.com" }]
keywords = ["arabic", "conjugation", "conjugator", "verb", "morphology", "nlp", "arabic-nlp", "sarf"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Natural Language :: Arabic",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]
dependencies = []

[project.scripts]
mazini = "mazini.cli:main"

[project.urls]
Homepage = "https://github.com/forzagreen/mazini"
Repository = "https://github.com/forzagreen/mazini"
Issues = "https://github.com/forzagreen/mazini/issues"
Demo = "https://forzagreen.github.io/mazini-js/"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/mazini"]

[tool.hatch.build.targets.sdist]
include = ["src/mazini", "tests", "tools", "README.md"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "UP031"]

[tool.pytest.ini_options]
testpaths = ["tests"]
