name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Sync (dev deps)
        run: uv sync --frozen --no-progress || uv sync --no-progress
      - name: Lint
        run: uv run ruff check
      - name: Test
        run: uv run pytest -q

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: uv build
      - name: Verify offline install from wheel
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          /tmp/venv/bin/python -c "import mazini; v = mazini.conjugate('كتب', 'فعَل يفعُل'); assert v.slots['past_3ms'][0].form == 'كَتَبَ'; print('ok', len(v.slots))"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
